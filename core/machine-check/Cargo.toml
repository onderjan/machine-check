[package]
name = "machine-check"

description = "Formal verification tool for digital systems"
homepage = "https://machine-check.org/"
repository = "https://github.com/onderjan/machine-check"
license = "MIT OR Apache-2.0"
readme = "README.md"

edition = "2021"
rust-version = "1.88"
version = "0.7.0"

[features]
gui = ["machine-check-gui"]
Zdual_interval = ["mck/Zdual_interval"]
Zeq_domain = ["mck/Zeq_domain"]

[dependencies]
machine-check-common = "=0.7.0"
mck = "=0.7.0"
machine-check-macros = "=0.7.0"
machine-check-machine = "=0.7.0"
machine-check-exec = "=0.7.0"
machine-check-gui = { version = "=0.7.0", optional = true }

log = "0.4.20"
env_logger = "0.10.0"
clap = { version = "4.4.6", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
rmp-serde = "1.3.0"
serde_json = "1.0.145"

proc-macro2 = { version = "1.0.67" }

[dev-dependencies]
trybuild = "1.0.105"
escargot = "0.5.15"

# These examples must be explicitely specified
# as Cargo does not by default consider nested examples
# except for those in subfolders with name main.rs.
# 
# We use them to test the examples in the book.

[[example]]
name = "book_quickstart"
path = "examples/book/book_quickstart.rs"

[[example]]
name = "book_instances_input"
path = "examples/book/book_instances_input.rs"

[[example]]
name = "book_instances_todo"
path = "examples/book/book_instances_todo.rs"

# Miscellaneous examples with use as tests.

[[example]]
name = "misc_freerun"
path = "examples/misc/freerun.rs"

[[example]]
name = "misc_array"
path = "examples/misc/array.rs"

[[example]]
name = "misc_signed"
path = "examples/misc/signed.rs"

[lints.clippy]
uninlined_format_args = "allow"
