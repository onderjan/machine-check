[package]
name = "machine-check-gui"

description = "Utility crate for the formal verification tool machine-check"
homepage = "https://machine-check.org/"
repository = "https://github.com/onderjan/machine-check"
license = "MIT OR Apache-2.0"
readme = "README.md"

edition = "2021"
rust-version = "1.88"
version = "0.7.1-alpha.1"

include = ["/**", "!/target/**", "!/.gitignore"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# For debug-logging build statements. 
build-log-debug = []

[dependencies]
# Shared dependencies.
#
# Note that we need to be also able to compile the frontend 
# using the backend architecture, so this includes dependencies 
# that are frontend-only in practice.
machine-check-common = "=0.7.1-alpha.1"
mck = "=0.7.1-alpha.1"

web-sys = { version = "0.3.76", features = [
    "console",
    "Window",
    "Document",
    "HtmlElement",
    "HtmlButtonElement",
    "HtmlTableElement",
    "HtmlTableRowElement",
    "HtmlTableCellElement",
    "HtmlUListElement",
    "HtmlLiElement",
    "HtmlInputElement",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "Node",
    "CanvasRenderingContext2d",
    "TextMetrics",
    "HtmlCanvasElement",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "DomRect",
    "CssStyleDeclaration",
    "DomTokenList",
    "ResizeObserver",
] }


anyhow = "1.0.89"
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.228", features = ["derive"] }
rmp-serde = "1.3.0"
bimap = "0.6.3"
rstar = "0.12.2"
chrono = { version = "0.4.40", features = ["serde"] }
hex = "0.4.3"
indexmap = { version = "2.12.0", features = ["serde"] }

icondata = { version = "0.6.0", default-features = false, features = [
    "bootstrap-icons",
    "tabler-icons",
] }

# require exact versions of wasm-bindgen and support
# to alleviate incompatibility problems
wasm-bindgen = "=0.2.106"
wasm-bindgen-futures = "=0.4.56"
serde-wasm-bindgen = "=0.6.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Backend-only dependencies.
machine-check-machine = "=0.7.1-alpha.1"
machine-check-exec = "=0.7.1-alpha.1"

proc-macro2 = { version = "1.0.67" }
petgraph = "0.6.4"
log = "0.4.20"
env_logger = "0.10.0"
wry = { version = "0.53.5", features = ["devtools"] }
tao = "0.34.5"
http = "1.1.0"
mime_guess = "2.0.5"
include_dir = "0.6.2"

[build-dependencies]
# Used to prepare the frontend build.
tempfile = "3.15.0"
toml_edit = "0.22.22"
anyhow = "1.0.89"
tinyjson = "2"
merkle_hash = "3.7.0"
hex = "0.4.3"

[lints.clippy]
uninlined_format_args = "allow"
