[package]
name = "machine-check-exec"

description = "Utility crate for the formal verification tool machine-check"
homepage = "https://machine-check.org/"
repository = "https://github.com/onderjan/machine-check"
license = "MIT OR Apache-2.0"
readme = "README.md"

edition = "2021"
rust-version = "1.88"
version = "0.7.0-alpha.5"

[dependencies]
mck = "=0.7.0-alpha.5"
machine-check-common = "=0.7.0-alpha.5"
machine-check-machine = "=0.7.0-alpha.5"

log = "0.4.20"

bimap = "0.6.3"
petgraph = "0.6.4"
partitions = "0.2.4"

serde = { version = "1.0.228", features = ["derive"] }
rmp-serde = "1.3.0"


[lints.clippy]
uninlined_format_args = "allow"
