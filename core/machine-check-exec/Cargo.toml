[package]
name = "machine-check-exec"
version = "0.6.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Utility crate for the formal verification tool machine-check"
rust-version = "1.88"

[dependencies]
mck = "=0.6.1"
machine-check-common = "=0.6.1"
machine-check-machine = "=0.6.1"

log = "0.4.20"

bimap = "0.6.3"
petgraph = "0.6.4"
partitions = "0.2.4"

serde = { version = "1.0.228", features = ["derive"] }
rmp-serde = "1.3.0"


[lints.clippy]
uninlined_format_args = "allow"
