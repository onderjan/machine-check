[package]
name = "machine-check-machine"

description = "Utility crate for the formal verification tool machine-check"
homepage = "https://machine-check.org/"
repository = "https://github.com/onderjan/machine-check"
license = "MIT OR Apache-2.0"
readme = "README.md"

edition = "2021"
rust-version = "1.95"
version = "0.7.1"

[features]
# A debug feature to write the intermediate machine description files to the Rust directory.
write_machine = []

[dependencies]
machine-check-common = "=0.7.1"
machine-check-bitmask-switch = "=0.5.0"
mck = "=0.7.1"

proc-macro2 = "1.0.67"
syn = { version = "2.0.37", features = ["visit-mut", "extra-traits", "visit"] }
syn-path = "2.0.0"
quote = "1.0.28"
prettyplease = "0.2.15"
thiserror = "1.0.49"
vec1 = "1.12.1"
strum = { version = "0.27", features = ["derive"] }
indexmap = { version = "2.12.0", features = ["serde"] }
union-find = "0.4.4"

serde = { version = "1.0.228", features = ["derive"] }
rmp-serde = "1.3.0"

[lints.clippy]
uninlined_format_args = "allow"
