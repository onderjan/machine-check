[package]
name = "mck"
version = "0.6.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Type/operation utility crate for the formal verification tool machine-check"
rust-version = "1.88"

[features]
Zdual_interval = []

[dependencies]
seq-macro = "0.3.5"
num = "0.4.3"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[lints.clippy]
uninlined_format_args = "allow"
