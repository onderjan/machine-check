[package]
name = "machine-check-compile"

description = "Utility crate for the formal verification tool machine-check"
homepage = "https://machine-check.org/"
repository = "https://github.com/onderjan/machine-check"
license = "MIT OR Apache-2.0"
readme = "README.md"

edition = "2021"
rust-version = "1.88"
version = "0.7.0-alpha.2"

[features]
gui = []
Zdual_interval = []
Zeq_domain = []

[dependencies]
machine-check-common = "=0.7.0-alpha.2"

syn = { version = "2.0.37", features = ["visit-mut", "extra-traits"] }
serde = "1.0.228"
serde_json = "1.0.145"
tempdir = "0.3.7"
log = "0.4.20"
env_logger = "0.10.0"
camino = "1.1.6"
cargo_metadata = "0.18.0"
thiserror = "1.0.49"
prettyplease = "0.2.15"

[lints.clippy]
uninlined_format_args = "allow"
