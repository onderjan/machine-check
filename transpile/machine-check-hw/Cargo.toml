[package]
name = "machine-check-hw"


description = "System crate for machine-check for verification of BTOR2 files"
homepage = "https://machine-check.org/"
repository = "https://github.com/onderjan/machine-check"
license = "MIT OR Apache-2.0"
readme = "README.md"

edition = "2021"
rust-version = "1.95"
version = "0.7.1"

[features]
gui = ["machine-check-compile/gui"]
Zdual_interval = ["machine-check-compile/Zdual_interval"]
Zeq_domain = ["machine-check-compile/Zeq_domain"]

[dependencies]
machine-check-common = "=0.7.1"
machine-check-compile = "=0.7.1"

btor2rs = "=0.1.0"
proc-macro2 = "1.0.67"
syn = { version = "2.0.37", features = ["visit-mut", "extra-traits"] }
quote = "1.0.28"
syn-path = "2.0.0"
serde = "1.0.228"
serde_json = "1.0.145"
tempdir = "0.3.7"
log = "0.4.20"
env_logger = "0.10.0"
clap = { version = "4.4.6", features = ["derive"] }
camino = "1.1.6"
cargo_metadata = "0.18.0"
thiserror = "1.0.49"
prettyplease = "0.2.15"

[lints.clippy]
uninlined_format_args = "allow"
